[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-webrtc-studio"
version = "2.0.0"
description = "Production-grade Streamlit WebRTC live streaming studio with computer vision filters & ICE diagnostics"
authors = [{ name = "Ketan", email = "ketanpalankar123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.35.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.22.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
webrtc = [
    "streamlit-webrtc>=0.47.0",
    "av>=12.0.0",
    "twilio>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
]
